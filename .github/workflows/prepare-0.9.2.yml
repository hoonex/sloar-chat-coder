name: Prepare Sloar 0.9.2 Metadata

on:
  push:
    branches:
      - release/0.9.2

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'chore: prepare 0.9.2 metadata mission'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.9.2
          fetch-depth: 0
      - name: Prepare release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "0.9.2"
          Path("VERSION").write_text(version + "\n", encoding="utf-8")

          skill = Path(".agents/skills/sloar-chat-coder/SKILL.md")
          text = skill.read_text(encoding="utf-8")
          text, count = re.subn(
              r'(^\s*version:\s*")[0-9]+\.[0-9]+\.[0-9]+("\s*$)',
              rf'\g<1>{version}\g<2>',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit("SKILL version replacement failed")
          skill.write_text(text, encoding="utf-8")

          wizard = Path(".agents/skills/sloar-chat-coder/scripts/wizard.py")
          text = wizard.read_text(encoding="utf-8")
          text, count = re.subn(
              r'^CURRENT_SLOAR_VERSION\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"$',
              f'CURRENT_SLOAR_VERSION = "{version}"',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit("wizard version replacement failed")
          wizard.write_text(text, encoding="utf-8")

          for name, label in (("README.md", "Current stable"), ("README.ko.md", "현재 stable")):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = re.sub(
                  rf'{re.escape(label)}: \*\*[0-9]+\.[0-9]+\.[0-9]+\*\*',
                  f'{label}: **{version}**',
                  text,
                  count=1,
              )
              text = re.sub(r'stable-[0-9]+\.[0-9]+\.[0-9]+', f'stable-{version}', text, count=1)
              text = re.sub(r'alt="stable [0-9]+\.[0-9]+\.[0-9]+"', f'alt="stable {version}"', text, count=1)
              path.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "## Unreleased\n"
          if marker not in text:
              raise SystemExit("CHANGELOG Unreleased marker missing")
          section = (
              "\n\n## 0.9.2 - 2026-09-08\n\n"
              "Runtime-cache isolation audit patch.\n\n"
              "- Prevented Sloar Evals fixture materialization from copying local Python `__pycache__`, `.pyc`, or `.pyo` artifacts into isolated worktrees. This closes a stale-bytecode false-GREEN path where a same-size seed patch could change source bytes while Python still executed copied cached bytecode.\n"
              "- Added a nested `.gitignore` to the installed `sloar-chat-coder` Skill so running bundled Python helpers such as `doctor.py` and `wizard.py` does not make an otherwise clean target repository appear dirty merely because Python created runtime bytecode caches.\n"
              "- Added focused regression tests proving eval worktrees exclude stale runtime caches and installed helper execution preserves clean Git state.\n"
              "- Completed a second full-system audit after the fixes: 122 deterministic tests passed, including install/readiness/checkpoint, rollover/takeover/fencing, forge/ref-cleanup classification, Android preflight, engineering closure, eval runner/comparison, upgrade preservation, and the existing protocol/design/publication contracts. Provider-authenticated model execution, real-device Android behavior, and rendered UI quality remain separate environment-specific evidence surfaces.\n"
          )
          text = text.replace(marker, marker + section, 1)
          changelog.write_text(text, encoding="utf-8")

          Path(".github/workflows/prepare-0.9.2.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare Sloar 0.9.2 metadata"
          git push origin HEAD:release/0.9.2
