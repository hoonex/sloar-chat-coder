name: Prepare Sloar 0.9.2 Reconciled

on:
  push:
    branches:
      - release/0.9.2-reconciled

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message == 'chore: dispatch 0.9.2 reconcile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.9.2-reconciled
          fetch-depth: 0
      - name: Prepare 0.9.2 metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          version = "0.9.2"
          Path("VERSION").write_text(version + "\n", encoding="utf-8")

          skill = Path(".agents/skills/sloar-chat-coder/SKILL.md")
          text = skill.read_text(encoding="utf-8")
          text, n = re.subn(r'(^\s*version:\s*")[0-9]+\.[0-9]+\.[0-9]+("\s*$)', rf'\g<1>{version}\g<2>', text, count=1, flags=re.M)
          assert n == 1
          skill.write_text(text, encoding="utf-8")

          wizard = Path(".agents/skills/sloar-chat-coder/scripts/wizard.py")
          text = wizard.read_text(encoding="utf-8")
          text, n = re.subn(r'^CURRENT_SLOAR_VERSION\s*=\s*"[0-9]+\.[0-9]+\.[0-9]+"$', f'CURRENT_SLOAR_VERSION = "{version}"', text, count=1, flags=re.M)
          assert n == 1
          wizard.write_text(text, encoding="utf-8")

          for name, label in (("README.md", "Current stable"), ("README.ko.md", "현재 stable")):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text = re.sub(rf'{re.escape(label)}: \*\*[0-9]+\.[0-9]+\.[0-9]+\*\*', f'{label}: **{version}**', text, count=1)
              text = re.sub(r'stable-[0-9]+\.[0-9]+\.[0-9]+', f'stable-{version}', text, count=1)
              text = re.sub(r'alt="stable [0-9]+\.[0-9]+\.[0-9]+"', f'alt="stable {version}"', text, count=1)
              if name == "README.ko.md":
                  text = text.replace("0.9.1은 채팅에서 직접 체크포인트 JSON을 저장하는 절차와 GitHub 동시 수정 보호를 명시한다.", "0.9.2는 채팅에서 직접 체크포인트 JSON을 저장하는 절차와 GitHub 동시 수정 보호를 명시한다.")
              path.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          m = re.search(r'^## Unreleased\n(?P<body>.*?)(?=^## 0\.9\.1\b)', text, re.M | re.S)
          if not m:
              raise SystemExit("Unreleased section not found")
          existing = m.group('body').strip()
          prefix = (
              "Runtime-cache isolation and ChatGPT/GitHub integrity patch.\n\n"
              "- Prevented Sloar Evals fixture materialization from copying Python runtime caches into isolated worktrees, closing a stale-bytecode false-GREEN path.\n"
              "- Added nested runtime-cache ignores so running bundled Python helpers does not dirty an otherwise clean installed target repository.\n"
          )
          section = "## Unreleased\n\n## 0.9.2 - 2026-09-09\n\n" + prefix
          if existing:
              section += existing + "\n\n"
          text = text[:m.start()] + section + text[m.end():]
          changelog.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION .agents/skills/sloar-chat-coder/SKILL.md .agents/skills/sloar-chat-coder/scripts/wizard.py README.md README.ko.md CHANGELOG.md
          git commit -m "release: prepare Sloar 0.9.2 metadata"
          git push origin HEAD:release/0.9.2-reconciled
