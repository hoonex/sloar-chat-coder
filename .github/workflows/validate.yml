name: Validate Sloar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate helpers
        run: |
          set -euo pipefail
          bash -n .agents/skills/sloar-chat-coder/scripts/preflight.sh
          bash -n .agents/skills/sloar-chat-coder/scripts/verify-state.sh
          python3 -m py_compile .agents/skills/sloar-chat-coder/scripts/*.py
      - name: Validate continuity, ownership/evidence closure, adaptive design guidance, anti-slop, terminalization, upgrades and interrupted turns
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
      - name: Run Sloar self-test
        run: |
          set -euo pipefail
          bash .agents/skills/sloar-chat-coder/scripts/preflight.sh --self-test
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          bash .agents/skills/sloar-chat-coder/scripts/verify-state.sh "$head" "$tree" .
          python3 .agents/skills/sloar-chat-coder/scripts/write-checkpoint.py \
            --worktree . \
            --repository "$GITHUB_REPOSITORY" \
            --stage VERIFY \
            --base "$head" \
            --output "$RUNNER_TEMP/sloar-checkpoint.json"
          python3 - "$RUNNER_TEMP/sloar-checkpoint.json" "$GITHUB_REPOSITORY" "$head" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['repository']==sys.argv[2]
          assert data['head']==sys.argv[3]
          assert data['stage']=='VERIFY'
          assert data['dirty'] is False
          print('checkpoint: ok')
          PY
      - name: Validate first-run installer, doctor, engineering closure, design companions, connections and forge resilience
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/first-run-target"
          mkdir -p "$target"
          git -C "$target" init -q
          git -C "$target" config user.email test@example.com
          git -C "$target" config user.name test
          git -C "$target" remote add origin https://github.com/example/example.git
          printf '# Existing guidance\n' > "$target/AGENTS.md"
          printf 'hello\n' > "$target/file.txt"
          printf '{}\n' > "$target/vercel.json"
          mkdir -p "$target/supabase"
          printf 'project_id = "example"\n' > "$target/supabase/config.toml"
          printf '{"dependencies":{"openai":"1.0.0"}}\n' > "$target/package.json"
          git -C "$target" add .
          git -C "$target" commit -qm init

          python3 .agents/skills/sloar-chat-coder/scripts/install.py --target "$target"
          test -s "$target/.agents/skills/sloar-chat-coder/SKILL.md"
          test -s "$target/.agents/skills/sloar-chat-coder/references/chat-native-continuity.md"
          test -s "$target/.agents/skills/sloar-chat-coder/references/upgrading.md"
          test -s "$target/.agents/skills/sloar-chat-coder/references/operational-continuity.md"
          test -s "$target/.agents/skills/sloar-chat-coder/references/turn-terminalization.md"
          test -s "$target/.agents/skills/sloar-chat-coder/references/ownership-evidence-closure.md"
          test -s "$target/.agents/skills/sloar-chat-coder/references/android-engineering.md"
          test -s "$target/.agents/skills/sloar-chat-coder/scripts/android-preflight.py"
          test -s "$target/.agents/skills/sloar-chat-coder/scripts/engineering-closure.py"
          test -s "$target/.agents/skills/sloar-chat-coder/scripts/session-rollover.py"
          test -s "$target/.agents/skills/sloar-chat-coder/scripts/turn-state.py"
          test -s "$target/.agents/skills/web-design-guidance/SKILL.md"
          test -s "$target/.agents/skills/web-design-guidance/references/design-discovery.md"
          test -s "$target/.agents/skills/web-design-guidance/references/adaptive-design-discovery.md"
          test -s "$target/.agents/skills/web-design-guidance/references/design-taxonomy.md"
          test -s "$target/.agents/skills/web-design-guidance/references/anti-ai-slop.md"
          test -s "$target/.agents/skills/web-design-guidance/references/surface-recipes.md"
          test -s "$target/.agents/skills/web-design-guidance/references/visual-verification.md"
          test -s "$target/.agents/skills/apple-web-design/SKILL.md"
          grep -q 'sloar-chat-coder:begin' "$target/AGENTS.md"
          grep -q 'web-design-guidance/SKILL.md' "$target/AGENTS.md"
          test "$(grep -c 'sloar-chat-coder:begin' "$target/AGENTS.md")" -eq 1

          python3 .agents/skills/sloar-chat-coder/scripts/install.py --target "$target"
          test "$(grep -c 'sloar-chat-coder:begin' "$target/AGENTS.md")" -eq 1

          python3 "$target/.agents/skills/sloar-chat-coder/scripts/doctor.py" "$target" --json > "$RUNNER_TEMP/doctor.json"
          python3 - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['schema']==2
          assert data['sloar_installed'] is True
          assert data['git']['is_worktree'] is True
          assert data['git']['head']
          assert data['chat_capabilities']=='not-detectable-locally'
          assert data['hosted_capabilities']['repository_write']=='unknown'
          print('first-run: ok')
          PY

          python3 "$target/.agents/skills/sloar-chat-coder/scripts/wizard.py" "$target" --stable-version 0.8.3 --json > "$RUNNER_TEMP/wizard.json"
          python3 - "$RUNNER_TEMP/wizard.json" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['schema']==2
          assert data['sloar_version']=='0.8.3'
          assert data['repository']['state']=='ready'
          assert data['repository']['installed'] is True
          assert data['updates']['installed_version']=='0.8.3'
          assert data['updates']['stable_version']=='0.8.3'
          assert data['updates']['status']=='current'
          assert data['updates']['action']=='none'
          assert data['updates']['silent_when_current'] is True
          assert 'approval' in data['updates']['install_policy']
          assert data['execution']['state']=='ready'
          assert data['hosted']['repository_write']=='unknown'
          assert data['hosted']['forge_health']=='unknown'
          assert data['resilience']['local_status']=='LOCAL_READY'
          assert data['continuity']['turn_state_helper'].endswith('turn-state.py')
          assert 'indefinite self-extension' in data['continuity']['turn_terminalization']
          assert data['engineering_closure']['reference']=='ready'
          assert data['engineering_closure']['helper']=='ready'
          assert data['engineering_closure']['helper_path'].endswith('engineering-closure.py')
          assert 'ownership before workaround' in data['engineering_closure']['policy']
          assert data['design']['web_design_companion']=='ready'
          assert data['design']['adaptive_discovery']=='ready'
          assert data['design']['design_taxonomy']=='ready'
          assert data['design']['anti_ai_slop_audit']=='ready'
          assert data['design']['apple_design_companion']=='ready'
          assert 'ambiguity controls question depth' in data['design']['policy']
          items={item['id']:item for item in data['connections']['items']}
          assert {'github','vercel','supabase','openai-platform'} <= set(items)
          assert 'netlify' not in items
          assert items['github']['level']=='baseline_for_remote_workflow'
          assert all(item['status']=='unknown' and item['connect_by_user'] is True for item in items.values())
          assert 'user connects external services explicitly' in data['hosted']['reason']
          print('wizard connections/design/engineering-closure/update-awareness: ok')
          PY

          cat > "$RUNNER_TEMP/closure.json" <<'EOF'
          {
            "ownership": [{
              "decision": "example-mode",
              "authoritative_owner": "app.js",
              "writers": ["app.js"],
              "independent_deciders": ["app.js"]
            }],
            "claims": [{
              "id": "example-claim",
              "target": "head",
              "requires": ["focused-test"],
              "evidence": ["focused"]
            }],
            "evidence": [{
              "id": "focused",
              "target": "head",
              "result": "pass",
              "covers": ["focused-test"]
            }],
            "convergence": {
              "required": ["source", "verified"],
              "observed": {"source": "head", "verified": "head"}
            }
          }
          EOF
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/engineering-closure.py" "$RUNNER_TEMP/closure.json" --json > "$RUNNER_TEMP/closure-result.json"
          python3 - "$RUNNER_TEMP/closure-result.json" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['schema']==1
          assert data['status']=='READY'
          assert data['summary']['claims_closed']==1
          assert data['findings']==[]
          print('engineering closure: ok')
          PY

          python3 "$target/.agents/skills/sloar-chat-coder/scripts/wizard.py" "$target" --stable-version 0.9.0 --json > "$RUNNER_TEMP/wizard-update.json"
          python3 - "$RUNNER_TEMP/wizard-update.json" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['updates']['status']=='update_available'
          assert data['updates']['action']=='ask_user_before_upgrade'
          assert data['updates']['installed_version']=='0.8.3'
          assert data['updates']['stable_version']=='0.9.0'
          print('wizard update notice: ok')
          PY

          python3 "$target/.agents/skills/sloar-chat-coder/scripts/wizard.py" "$target" --stable-version 0.8.3 | grep -q '^Sloar readiness$'
          if python3 "$target/.agents/skills/sloar-chat-coder/scripts/wizard.py" "$target" --stable-version 0.8.3 | grep -q '^Sloar update:'; then
            echo 'current stable must stay silent in human readiness output' >&2
            exit 1
          fi
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/wizard.py" "$target" --stable-version 0.9.0 | grep -q 'Sloar update: 0.8.3 -> 0.9.0 available (approval required)'
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/wizard.py" "$target" | grep -q 'Engineering closure: reference=ready, helper=ready'
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/wizard.py" "$target" | grep -q 'Web design companion: ready (adaptive=ready, anti-slop=ready)'
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/wizard.py" "$target" | grep -q 'Suggested connections: GitHub'

          python3 "$target/.agents/skills/sloar-chat-coder/scripts/turn-state.py" begin "$target" \
            --goal 'CI smoke turn' \
            --response-language ko-KR \
            --anchor "verified_commit=$(git -C "$target" rev-parse HEAD)" \
            --json > "$RUNNER_TEMP/turn-begin.json"
          read -r turn_id epoch < <(python3 - "$RUNNER_TEMP/turn-begin.json" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(data['turn_id'], data['epoch'])
          PY
          )
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/turn-state.py" check-fence "$target" --turn-id "$turn_id" --epoch "$epoch"
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/turn-state.py" complete "$target" \
            --turn-id "$turn_id" --epoch "$epoch" --status COMPLETED --evidence 'ci-smoke:pass' --json > "$RUNNER_TEMP/turn-complete.json"
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/turn-state.py" recover "$target" --json > "$RUNNER_TEMP/turn-recover.json"
          python3 - "$RUNNER_TEMP/turn-recover.json" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['recovery_state']=='TERMINAL_REPLAY_AVAILABLE'
          assert data['turn']['status']=='COMPLETED'
          assert data['comparison']['state']=='EXACT'
          print('turn continuity: ok')
          PY

          python3 "$target/.agents/skills/sloar-chat-coder/scripts/forge-health.py" "$target" --json > "$RUNNER_TEMP/forge-local.json"
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/forge-health.py" "$target" --probe --json > "$RUNNER_TEMP/forge-degraded.json"

          cat > "$RUNNER_TEMP/workflow-permission.log" <<'EOF'
          remote rejected: refusing to allow a GitHub App to create or update workflow `.github/workflows/check.yml` without `workflows` permission
          EOF
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/forge-health.py" --classify-file "$RUNNER_TEMP/workflow-permission.log" --json > "$RUNNER_TEMP/forge-partial.json"
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/forge-health.py" --classify-error 'HTTP 429 secondary rate limit exceeded' --json > "$RUNNER_TEMP/forge-rate-limit.json"
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/forge-health.py" --classify-error 'rejected non-fast-forward; fetch first' --json > "$RUNNER_TEMP/forge-moved.json"

          python3 - "$RUNNER_TEMP/forge-local.json" "$RUNNER_TEMP/forge-degraded.json" "$RUNNER_TEMP/forge-partial.json" "$RUNNER_TEMP/forge-rate-limit.json" "$RUNNER_TEMP/forge-moved.json" <<'PY'
          import json, pathlib, sys
          local,degraded,partial,rate,moved=[json.loads(pathlib.Path(p).read_text()) for p in sys.argv[1:]]
          assert local['schema']==2 and local['kind']=='health'
          assert local['local']['state']=='LOCAL_READY'
          assert local['remote']['state']=='unknown'
          assert local['publication']=='unknown'
          assert degraded['schema']==2
          assert degraded['local']['state']=='LOCAL_READY'
          assert degraded['remote']['state']=='REMOTE_DEGRADED'
          assert degraded['publication']=='PUBLICATION_BLOCKED'
          assert partial['classification']=='CAPABILITY_MISMATCH'
          assert partial['remote_state']=='REMOTE_PARTIAL'
          assert partial['retry']=='change_strategy'
          assert rate['classification']=='REMOTE_DEGRADED'
          assert rate['retry']=='defer'
          assert moved['classification']=='REMOTE_MOVED'
          assert moved['retry']=='reconcile'
          print('forge resilience: ok')
          PY
      - name: Validate skill frontmatter contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          core = Path('.agents/skills/sloar-chat-coder/SKILL.md')
          text = core.read_text(encoding='utf-8')
          assert text.startswith('---\n'), 'SKILL.md must start with YAML frontmatter'
          _, fm, body = text.split('---', 2)
          fields = {}
          for line in fm.splitlines():
              if ':' in line and not line.startswith(' '):
                  k, v = line.split(':', 1)
                  fields[k.strip()] = v.strip()
          assert fields.get('name') == 'sloar-chat-coder'
          assert fields.get('description'), 'description is required'
          assert len(fields['name']) <= 64
          assert len(fields['description']) <= 1024
          assert body.strip(), 'skill body is empty'
          assert Path('VERSION').read_text().strip() == '0.8.3'
          assert 'version: "0.8.3"' in text
          assert Path('.agents/skills/sloar-chat-coder/references/forge-resilience.md').is_file()
          assert Path('.agents/skills/sloar-chat-coder/references/chat-native-continuity.md').is_file()
          assert Path('.agents/skills/sloar-chat-coder/references/upgrading.md').is_file()
          assert Path('.agents/skills/sloar-chat-coder/references/operational-continuity.md').is_file()
          assert Path('.agents/skills/sloar-chat-coder/references/turn-terminalization.md').is_file()
          assert Path('.agents/skills/sloar-chat-coder/references/ownership-evidence-closure.md').is_file()
          assert Path('.agents/skills/sloar-chat-coder/references/android-engineering.md').is_file()
          assert Path('.agents/skills/sloar-chat-coder/scripts/android-preflight.py').is_file()
          assert Path('.agents/skills/sloar-chat-coder/scripts/engineering-closure.py').is_file()
          assert Path('.agents/skills/sloar-chat-coder/scripts/forge-health.py').is_file()
          assert Path('.agents/skills/sloar-chat-coder/scripts/session-rollover.py').is_file()
          assert Path('.agents/skills/sloar-chat-coder/scripts/turn-state.py').is_file()
          assert 'Ownership before workaround' in text
          assert 'SOURCE -> VERIFIED -> PACKAGED -> DEPLOYED -> SERVED -> CACHED -> FIRST_FRAME' in text
          design = Path('.agents/skills/web-design-guidance/SKILL.md')
          design_text = design.read_text(encoding='utf-8')
          assert design_text.startswith('---\n')
          assert 'name: web-design-guidance' in design_text
          assert 'version: "0.8.0"' in design_text
          assert Path('.agents/skills/web-design-guidance/references/design-discovery.md').is_file()
          assert Path('.agents/skills/web-design-guidance/references/adaptive-design-discovery.md').is_file()
          assert Path('.agents/skills/web-design-guidance/references/design-taxonomy.md').is_file()
          assert Path('.agents/skills/web-design-guidance/references/anti-ai-slop.md').is_file()
          assert Path('.agents/skills/web-design-guidance/references/surface-recipes.md').is_file()
          assert Path('.agents/skills/web-design-guidance/references/visual-verification.md').is_file()
          assert Path('docs/INTERRUPTED_TURNS.md').is_file()
          assert Path('docs/INTERRUPTED_TURNS.ko.md').is_file()
          assert Path('docs/CONNECTIONS.md').is_file()
          assert Path('docs/CONNECTIONS.ko.md').is_file()
          print('frontmatter: ok')
          PY