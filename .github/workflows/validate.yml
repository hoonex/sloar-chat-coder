name: Validate Sloar

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate helpers
        run: |
          set -euo pipefail
          bash -n .agents/skills/sloar-chat-coder/scripts/preflight.sh
          bash -n .agents/skills/sloar-chat-coder/scripts/verify-state.sh
          python3 -m py_compile .agents/skills/sloar-chat-coder/scripts/*.py
      - name: Run Sloar self-test
        run: |
          set -euo pipefail
          bash .agents/skills/sloar-chat-coder/scripts/preflight.sh --self-test
          head="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          bash .agents/skills/sloar-chat-coder/scripts/verify-state.sh "$head" "$tree" .
          python3 .agents/skills/sloar-chat-coder/scripts/write-checkpoint.py \
            --worktree . \
            --repository "$GITHUB_REPOSITORY" \
            --stage VERIFY \
            --base "$head" \
            --output "$RUNNER_TEMP/sloar-checkpoint.json"
          python3 - "$RUNNER_TEMP/sloar-checkpoint.json" "$GITHUB_REPOSITORY" "$head" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['repository']==sys.argv[2]
          assert data['head']==sys.argv[3]
          assert data['stage']=='VERIFY'
          assert data['dirty'] is False
          print('checkpoint: ok')
          PY
      - name: Validate first-run installer, doctor and forge resilience
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/first-run-target"
          mkdir -p "$target"
          git -C "$target" init -q
          git -C "$target" config user.email test@example.com
          git -C "$target" config user.name test
          printf '# Existing guidance\n' > "$target/AGENTS.md"
          printf 'hello\n' > "$target/file.txt"
          git -C "$target" add .
          git -C "$target" commit -qm init

          python3 .agents/skills/sloar-chat-coder/scripts/install.py --target "$target"
          test -s "$target/.agents/skills/sloar-chat-coder/SKILL.md"
          grep -q 'sloar-chat-coder:begin' "$target/AGENTS.md"
          test "$(grep -c 'sloar-chat-coder:begin' "$target/AGENTS.md")" -eq 1

          python3 .agents/skills/sloar-chat-coder/scripts/install.py --target "$target"
          test "$(grep -c 'sloar-chat-coder:begin' "$target/AGENTS.md")" -eq 1

          python3 "$target/.agents/skills/sloar-chat-coder/scripts/doctor.py" "$target" --json > "$RUNNER_TEMP/doctor.json"
          python3 - "$RUNNER_TEMP/doctor.json" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['schema']==2
          assert data['sloar_installed'] is True
          assert data['git']['is_worktree'] is True
          assert data['git']['head']
          assert data['chat_capabilities']=='not-detectable-locally'
          assert data['hosted_capabilities']['repository_write']=='unknown'
          print('first-run: ok')
          PY

          python3 "$target/.agents/skills/sloar-chat-coder/scripts/wizard.py" "$target" --json > "$RUNNER_TEMP/wizard.json"
          python3 - "$RUNNER_TEMP/wizard.json" <<'PY'
          import json, pathlib, sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert data['schema']==2
          assert data['sloar_version']=='0.4.0'
          assert data['repository']['state']=='ready'
          assert data['repository']['installed'] is True
          assert data['execution']['state']=='ready'
          assert data['hosted']['repository_write']=='unknown'
          assert data['hosted']['forge_health']=='unknown'
          assert data['resilience']['local_status']=='LOCAL_READY'
          assert 'agent' in data['hosted']['reason']
          print('wizard: ok')
          PY

          python3 "$target/.agents/skills/sloar-chat-coder/scripts/wizard.py" "$target" | grep -q '^Sloar readiness$'

          python3 "$target/.agents/skills/sloar-chat-coder/scripts/forge-health.py" "$target" --json > "$RUNNER_TEMP/forge-local.json"
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/forge-health.py" "$target" --probe --json > "$RUNNER_TEMP/forge-degraded.json"

          cat > "$RUNNER_TEMP/workflow-permission.log" <<'EOF'
          remote rejected: refusing to allow a GitHub App to create or update workflow `.github/workflows/check.yml` without `workflows` permission
          EOF
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/forge-health.py" --classify-file "$RUNNER_TEMP/workflow-permission.log" --json > "$RUNNER_TEMP/forge-partial.json"
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/forge-health.py" --classify-error 'HTTP 429 secondary rate limit exceeded' --json > "$RUNNER_TEMP/forge-rate-limit.json"
          python3 "$target/.agents/skills/sloar-chat-coder/scripts/forge-health.py" --classify-error 'rejected non-fast-forward; fetch first' --json > "$RUNNER_TEMP/forge-moved.json"

          python3 - "$RUNNER_TEMP/forge-local.json" "$RUNNER_TEMP/forge-degraded.json" "$RUNNER_TEMP/forge-partial.json" "$RUNNER_TEMP/forge-rate-limit.json" "$RUNNER_TEMP/forge-moved.json" <<'PY'
          import json, pathlib, sys
          local,degraded,partial,rate,moved=[json.loads(pathlib.Path(p).read_text()) for p in sys.argv[1:]]
          assert local['schema']==2 and local['kind']=='health'
          assert local['local']['state']=='LOCAL_READY'
          assert local['remote']['state']=='unknown'
          assert local['publication']=='unknown'
          assert degraded['schema']==2
          assert degraded['local']['state']=='LOCAL_READY'
          assert degraded['remote']['state']=='REMOTE_DEGRADED'
          assert degraded['remote']['git_transport']=='missing'
          assert degraded['publication']=='PUBLICATION_BLOCKED'
          assert partial['classification']=='CAPABILITY_MISMATCH'
          assert partial['rule']=='github-workflow-permission'
          assert partial['layer']=='workflow-write'
          assert partial['remote_state']=='REMOTE_PARTIAL'
          assert partial['retry']=='change_strategy'
          assert 'permission' not in partial.get('fingerprint','').lower()
          assert rate['classification']=='REMOTE_DEGRADED'
          assert rate['rule']=='rate-limit'
          assert rate['retry']=='defer'
          assert moved['classification']=='REMOTE_MOVED'
          assert moved['rule']=='remote-moved'
          assert moved['retry']=='reconcile'
          print('forge resilience: ok')
          PY
      - name: Validate skill frontmatter contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.agents/skills/sloar-chat-coder/SKILL.md')
          text = p.read_text(encoding='utf-8')
          assert text.startswith('---\n'), 'SKILL.md must start with YAML frontmatter'
          _, fm, body = text.split('---', 2)
          fields = {}
          for line in fm.splitlines():
              if ':' in line and not line.startswith(' '):
                  k, v = line.split(':', 1)
                  fields[k.strip()] = v.strip()
          assert fields.get('name') == 'sloar-chat-coder'
          assert fields.get('description'), 'description is required'
          assert len(fields['name']) <= 64
          assert len(fields['description']) <= 1024
          assert body.strip(), 'skill body is empty'
          assert Path('VERSION').read_text().strip() == '0.4.0'
          assert 'version: "0.4.0"' in text
          assert Path('.agents/skills/sloar-chat-coder/references/forge-resilience.md').is_file()
          assert Path('.agents/skills/sloar-chat-coder/scripts/forge-health.py').is_file()
          print('frontmatter: ok')
          PY
