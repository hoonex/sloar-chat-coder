name: Prepare Sloar 0.8.2

on:
  push:
    branches:
      - release/sloar-0.8.2
    paths:
      - ".github/workflows/prepare-0.8.2.yml"

permissions:
  contents: write

concurrency:
  group: prepare-sloar-0.8.2
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare 0.8.2 source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          old = "0.8.1"
          new = "0.8.2"

          version = Path("VERSION")
          current = version.read_text(encoding="utf-8").strip()
          if current not in {old, new}:
              raise SystemExit(f"unexpected VERSION: {current}")
          version.write_text(new + "\n", encoding="utf-8")

          skill = Path(".agents/skills/sloar-chat-coder/SKILL.md")
          text = skill.read_text(encoding="utf-8")
          text, count = re.subn(
              r'(?m)^\s*version:\s*["\x27]?0\.8\.1["\x27]?\s*$',
              '  version: "0.8.2"',
              text,
              count=1,
          )
          if count == 0 and 'version: "0.8.2"' not in text:
              raise SystemExit("SKILL.md version marker not found")

          android_activation = (
              "For Android application/module creation, modification, build, signing, packaging, or distribution, "
              "read [references/android-engineering.md](references/android-engineering.md) before implementation. "
              "When local execution is available, run `scripts/android-preflight.py <repo> --json` first. "
              "Existing Android source is authoritative; an empty/non-Android repository enters the documented bootstrap path instead of guessing project structure. "
              "Compile/test/artifact success must remain separate from real-device UI, runtime, performance, thermal, and power evidence.\n\n"
          )
          if "references/android-engineering.md" not in text:
              anchor = "When ONBOARD is shown to the user, prefer a compact readiness capsule:\n"
              if anchor not in text:
                  raise SystemExit("SKILL.md Android activation insertion anchor missing")
              text = text.replace(anchor, android_activation + anchor, 1)
          skill.write_text(text, encoding="utf-8")

          wizard = Path(".agents/skills/sloar-chat-coder/scripts/wizard.py")
          text = wizard.read_text(encoding="utf-8")
          text, count = re.subn(
              r'(?m)^CURRENT_SLOAR_VERSION\s*=\s*["\x27]0\.8\.1["\x27]\s*$',
              'CURRENT_SLOAR_VERSION = "0.8.2"',
              text,
              count=1,
          )
          if count == 0 and 'CURRENT_SLOAR_VERSION = "0.8.2"' not in text:
              raise SystemExit("wizard version marker not found")
          wizard.write_text(text, encoding="utf-8")

          preflight = Path(".agents/skills/sloar-chat-coder/scripts/preflight.sh")
          text = preflight.read_text(encoding="utf-8")
          marker_old = '[[ "$(cat "$root/VERSION")" == "0.8.1" ]]'
          marker_new = '[[ "$(cat "$root/VERSION")" == "0.8.2" ]]'
          if marker_old in text:
              text = text.replace(marker_old, marker_new, 1)
          elif marker_new not in text:
              raise SystemExit("preflight VERSION marker not found")
          preflight.write_text(text, encoding="utf-8")

          update_test = Path("tests/test_update_awareness_contract.py")
          text = update_test.read_text(encoding="utf-8")
          text = text.replace(old, new)
          update_test.write_text(text, encoding="utf-8")

          android_test = Path("tests/test_android_skill_contract.py")
          text = android_test.read_text(encoding="utf-8")
          if "core_text = (SKILL / \"SKILL.md\")" not in text:
              needle = '        text = state_machine.read_text(encoding="utf-8")\n'
              replacement = (
                  needle
                  + '        core_text = (SKILL / "SKILL.md").read_text(encoding="utf-8")\n'
                  + '        self.assertIn("android-engineering.md", core_text)\n'
                  + '        self.assertIn("android-preflight.py", core_text)\n'
              )
              if needle not in text:
                  raise SystemExit("Android contract test insertion anchor missing")
              text = text.replace(needle, replacement, 1)
          android_test.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          heading = "## 0.8.2 - 2026-09-02"
          if heading not in text:
              anchor = "## Unreleased\n"
              if anchor not in text:
                  raise SystemExit("CHANGELOG Unreleased heading missing")
              section = """

          ## 0.8.2 - 2026-09-02

          Android engineering and distribution release.

          - Added `references/android-engineering.md` as a durable Android production playbook covering existing-project discovery, empty-repository bootstrap, Gradle/build commands, Compose/UI resilience, permissions/security, signing identity, update compatibility, APK/AAB distribution, and CI/CD evidence.
          - Added `scripts/android-preflight.py` to classify repositories as `EXISTING_ANDROID`, `PARTIAL_ANDROID`, or `EMPTY_OR_NON_ANDROID`, discover package/SDK/build facts, and surface static review hints for high-rate sensors, tight timers, unbounded loops, wake locks, listener lifecycle, continuous networking, and hot-path logging.
          - Separated Android compile/test/artifact success from `UI`, `DEVICE_RUNTIME`, `PERF`, `THERMAL`, and `POWER` evidence so a green CI build cannot be reported as proof of real-device heat, battery, touch, sensor, or OEM behavior.
          - Added real-device performance/thermal/power verification guidance, including bounded soak-test expectations for continuous sensor, game, navigation, camera, Bluetooth, media, and network workloads.
          - Wired Android activation into the Sloar engineering lifecycle and core Skill so installed repositories use their local bundled Android guidance instead of depending on the canonical Sloar repository for ordinary Android work.
          - Added regression coverage proving Android guidance and preflight tooling ship in fresh Sloar installations and remain connected to the core workflow.
          - Added validated release automation: release commits publish only after `Validate Sloar` succeeds, with an annotated version tag and GitHub Release tied to the exact source commit.
          """
              section = "\n".join(line[10:] if line.startswith("          ") else line for line in section.splitlines())
              text = text.replace(anchor, anchor + section + "\n", 1)
          changelog.write_text(text, encoding="utf-8")
          PY

      - name: Validate release source
        shell: bash
        run: |
          set -euo pipefail
          bash -n .agents/skills/sloar-chat-coder/scripts/preflight.sh
          bash -n .agents/skills/sloar-chat-coder/scripts/verify-state.sh
          python3 -m py_compile .agents/skills/sloar-chat-coder/scripts/*.py
          python3 -m unittest discover -s tests -v
          bash .agents/skills/sloar-chat-coder/scripts/preflight.sh --self-test
          test "$(tr -d '[:space:]' < VERSION)" = "0.8.2"
          grep -q 'version: "0.8.2"' .agents/skills/sloar-chat-coder/SKILL.md
          grep -q 'CURRENT_SLOAR_VERSION = "0.8.2"' .agents/skills/sloar-chat-coder/scripts/wizard.py
          grep -q 'VERSION.*0.8.2' .agents/skills/sloar-chat-coder/scripts/preflight.sh
          grep -q '^## 0.8.2 - 2026-09-02$' CHANGELOG.md
          grep -q 'android-engineering.md' .agents/skills/sloar-chat-coder/SKILL.md
          grep -q 'android-preflight.py' .agents/skills/sloar-chat-coder/SKILL.md

      - name: Publish validated release commit to release branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin release/sloar-0.8.2
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/release/sloar-0.8.2)"

          git add VERSION CHANGELOG.md \
            .agents/skills/sloar-chat-coder/SKILL.md \
            .agents/skills/sloar-chat-coder/scripts/wizard.py \
            .agents/skills/sloar-chat-coder/scripts/preflight.sh \
            tests/test_update_awareness_contract.py \
            tests/test_android_skill_contract.py

          if git diff --cached --quiet; then
            echo "Release source already prepared."
            exit 0
          fi

          git commit -m "release: Sloar 0.8.2 Android engineering"
          git push origin HEAD:release/sloar-0.8.2
